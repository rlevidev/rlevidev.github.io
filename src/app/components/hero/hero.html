<div class="wrap hero">
  <div class="hero-grid">
    <div>
      <p
        class="greeting"
        aria-live="polite"
        aria-atomic="true"
        [attr.aria-label]="state.t().hero_greeting"
      >
        {{ typedGreeting() }}
      </p>

      <h1 class="hero-intro">{{ state.t().hero_intro }}</h1>

      <p class="role-line">
        {{ state.t().hero_line1 }} · {{ state.t().hero_line2 }} ·
        <span class="role-highlight">{{ state.t().hero_highlight }}</span>
      </p>

      <div class="byline mono">
        {{ state.t().hero_byline_before
        }}<a [href]="socials.linkedin" target="_blank" rel="noopener noreferrer">Raí Levi</a
        >{{ state.t().hero_byline_after }}
      </div>

      <p nbText size="md" leading="relaxed" class="lede">{{ state.t().hero_lede }}</p>

      <div class="cta-row">
        <a
          class="social-mark"
          [href]="socials.github"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.2c-3.2.7-3.88-1.38-3.88-1.38-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.74-1.56-2.56-.3-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.18c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"
            />
          </svg>
        </a>
        <a
          class="social-mark"
          [href]="socials.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          title="LinkedIn"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v11.25H3V9.75Zm6.5 0h3.83v1.54h.05c.53-1 1.84-2.06 3.79-2.06 4.05 0 4.8 2.67 4.8 6.14v5.63h-4v-4.99c0-1.19-.02-2.72-1.66-2.72-1.66 0-1.92 1.3-1.92 2.64v5.07h-4V9.75Z"
            />
          </svg>
        </a>
      </div>
    </div>

    <app-terminal-card />
  </div>
</div>
