<header>
  <div class="header-inner">
    <div class="brand mono" [attr.title]="state.t().brand_name">RL</div>

    <nav>
      <a href="#projects">{{ state.t().nav_projects }}</a>
      <a href="#trajectory">{{ state.t().nav_trajectory }}</a>
      <a href="#certs">{{ state.t().nav_certs }}</a>
    </nav>

    <button
      type="button"
      nbButton
      size="sm"
      tone="white"
      class="mono lang-toggle"
      (click)="state.toggleLang()"
      [attr.aria-label]="state.t().lang_label"
      [title]="state.t().lang_label"
    >
      {{ langLabel() }}
    </button>
  </div>
</header>
